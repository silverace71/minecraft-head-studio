services:
  minecraft-head-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: minecraft-head-studio:local
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HEAD_STUDIO_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
